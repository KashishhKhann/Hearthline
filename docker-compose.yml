services:
  api:
    build: .
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    env_file: .env
    environment:
      HEARTHLINE_DB: /app/data/hearthline.db
    ports:
      - "8000:8000"
    volumes:
      - hearthline-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s

  ui:
    build: .
    env_file: .env
    environment:
      HEARTHLINE_DB: /app/data/hearthline.db
      HEARTHLINE_API_PUBLIC_URL: ${HEARTHLINE_API_PUBLIC_URL:-http://localhost:8000}
    ports:
      - "8501:8501"
    volumes:
      - hearthline-data:/app/data
    depends_on:
      - api

volumes:
  hearthline-data:
